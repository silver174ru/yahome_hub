send_action:
  name: Отправить действие
  description: Отправить произвольное действие устройству Яндекс Умного дома.
  fields:
    device_id:
      name: ID устройства
      description: Идентификатор устройства в Яндекс Умном доме.
      required: true
      selector:
        text:
    capability_type:
      name: Тип capability
      description: Например, devices.capabilities.on_off.
      required: true
      selector:
        text:
    instance:
      name: Instance
      description: Например, on, brightness, temperature.
      required: false
      selector:
        text:
    value:
      name: Значение
      description: Новое значение.
      required: true
      selector:
        object:

execute_scenario:
  name: Запустить сценарий
  description: Запустить сценарий Яндекс Умного дома.
  fields:
    scenario_id:
      name: ID сценария
      required: true
      selector:
        text:

refresh:
  name: Обновить данные
  description: Принудительно обновить все устройства и датчики.

export:
  name: Экспорт базы устройств
  description: Сохранить полную базу устройств в JSON.
  fields:
    path:
      name: Путь
      description: Необязательный путь внутри /config.
      required: false
      selector:
        text:

say:
  name: Озвучить текст
  description: Алиса произнесёт текст на выбранной колонке.
  fields:
    entity_id:
      name: Колонка
      required: true
      selector:
        entity:
          integration: yahome_hub
          domain: media_player
    message:
      name: Текст
      required: true
      selector:
        text:
          multiline: true
    volume_level:
      name: Громкость
      description: От 0 до 1.
      required: false
      selector:
        number:
          min: 0
          max: 1
          step: 0.05

set_led:
  name: Настроить подсветку
  description: Яркость LED-кольца и режим экрана Станции.
  fields:
    entity_id:
      name: Колонка
      required: true
      selector:
        entity:
          integration: yahome_hub
          domain: media_player
    brightness:
      name: Яркость
      description: От 0 до 1.
      required: false
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    visualization:
      name: Экран
      required: false
      selector:
        select:
          options:
            - clock
            - equalizer
    auto:
      name: Авто-яркость
      description: Автоматически подстраивать яркость подсветки под освещение.
      required: false
      selector:
        boolean:

set_speaker_config:
  name: Тестовые настройки колонки
  description: Экспериментально изменить настройки Станции (DND, качество музыки, язык, звонки и другие).
  fields:
    entity_id:
      name: Колонка
      required: true
      selector:
        entity:
          integration: yahome_hub
          domain: media_player
    config:
      name: Конфигурация
      description: 'Объект с настройками, например {"dndMode": {"enabled": true}}.'
      required: true
      selector:
        object:

stream_music:
  name: Транслировать музыку
  description: Повторяет музыку с колонки Яндекс на другие медиаплееры и синхронизирует громкость.
  fields:
    source_entity_id:
      name: Источник
      description: Колонка Яндекс Станции.
      required: true
      selector:
        entity:
          domain: media_player
    target_entity_ids:
      name: Получатели
      description: Колонки и медиаплееры, на которые нужно транслировать музыку.
      required: true
      selector:
        entity:
          domain: media_player
          multiple: true
    sync_volume:
      name: Синхронизация громкости
      description: 'true/false или Jinja2-шаблон, например "{{ volume_level / 2 }}".'
      required: false
      default: true
      selector:
        object:
    use_proxy:
      name: Использовать прокси
      description: Стабильная ссылка через Home Assistant вместо короткоживущей ссылки Яндекса.
      required: false
      default: true
      selector:
        boolean:
    start:
      name: Запустить сразу
      description: Если выключено, трансляция начнётся при следующем воспроизведении.
      required: false
      default: true
      selector:
        boolean:
    stop_targets:
      name: Останавливать получателей
      description: Останавливать получатели при завершении сессии.
      required: false
      default: true
      selector:
        boolean:

stop_stream_music:
  name: Остановить трансляцию музыки
  description: Отключает синхронизацию и при необходимости останавливает получатели.
  fields:
    session_id:
      name: ID сессии
      description: Если не указан, останавливаются все подходящие сессии.
      required: false
      selector:
        text:
    source_entity_id:
      name: Источник
      required: false
      selector:
        entity:
          domain: media_player
    target_entity_ids:
      name: Получатели
      required: false
      selector:
        entity:
          domain: media_player
          multiple: true
    stop_playback:
      name: Останавливать воспроизведение
      required: false
      default: true
      selector:
        boolean:
